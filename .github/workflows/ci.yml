name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, test and stage gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.6" "pytest>=8.0"

      - name: Lint
        run: ruff check tools

      - name: Format check
        run: ruff format --check tools

      - name: Unit tests
        run: pytest tools/tests

      - name: Spec index is in sync with the archive
        run: |
          python tools/gen_spec_index.py
          git diff --exit-code -- docs/specs/

      - name: Stage gate — project invariants
        run: python tools/runbook_validate.py --stage ALWAYS

      - name: Stage gate — STAGE-00 audit
        run: python tools/runbook_validate.py --stage STAGE-00

      - name: Selector must not crash
        run: |
          set +e
          python tools/runbook_next.py
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            echo "Selector exited with $code (expected 0 or 2)"
            exit 1
          fi
