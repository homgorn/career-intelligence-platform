name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Local check runner (lint, tests, stage gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.6" "pytest>=8.0"

      # Единственный источник истины: та же команда, что запускается локально.
      # Дублировать шаги в YAML нельзя — иначе локальная и облачная проверки
      # разъедутся и «зелёное локально» перестанет что-либо значить.
      - name: Run project checks
        run: python tools/check.py --skip-info
